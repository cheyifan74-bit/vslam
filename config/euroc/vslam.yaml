%YAML:1.0 # need to specify the file type at the top!

# ==================================================================
# VSLAM application parameters (non-OpenVINS)
# ==================================================================

# ------------------------------------------------------------------
# KeyframeSelect
# Images are fed by RosWrapper (left camera only).
# Pose is subscribed from OpenVINS pose topic.
# ------------------------------------------------------------------

# Selection thresholds
kf_dist_thresh: 0.5          # meters; select if translation from last KF exceeds this
kf_angle_thresh_deg: 10.0    # degrees; select if rotation from last KF exceeds this

# Image-pose timestamp sync
kf_sync_slop: 0.02           # seconds; max |t_image - t_pose| to pair

# Internal buffers
kf_pose_queue_size: 5000
kf_image_queue_size: 1000
kf_output_queue_size: 2000     # downstream KeyframeQueue capacity (drop oldest if full)

# Topics
kf_topic_pose: "/ov_msckf/poseimu"
kf_topic_keyframe_pose: "keyframe_pose"
kf_topic_keyframe_image: "keyframe_image"

# Publish selected keyframe pose/image for debugging / rosbag analysis
kf_publish_debug: true

# ------------------------------------------------------------------
# Map / MapManager
# Map: create COLMAP dirs + database.db (+ cameras)
# MapManager: consume keyframes and save images into the session
# Layout: <map_root_dir>/map/{database,images,masks,sparse}
# ------------------------------------------------------------------
map_root_dir: "/tmp/vslam_map"
map_clear_old_session: true
map_save_images: true
map_image_extension: "png"

# ------------------------------------------------------------------
# SIFT (COLMAP extractor; not OpenVINS tracking features)
# Defaults match COLMAP SiftExtractionOptions / FeatureExtractionOptions.
# GPU SIFT uses CUDA SiftGPU. GUI-off builds disable OpenGL SiftGPU.
# Rebuild with CUDA_ENABLED=ON (and a CUDA toolkit) to use GPU SIFT.
# OpenCV yaml cannot have ':' inside trailing comments on the same line as a value.
# ------------------------------------------------------------------
sift_use_gpu: true             # 1 = CUDA SiftGPU, 0 = VLFeat CPU SIFT
sift_gpu_index: "-1"           # -1 = auto (CUDA device 0), or 0 / 1 / ...
sift_max_num_features: 1000
sift_first_octave: -1          # -1 upsamples the image once
sift_num_octaves: 4
sift_octave_resolution: 3      # levels per octave
sift_peak_threshold: 0.0066666666667  # COLMAP default = 0.02 / octave_resolution
sift_edge_threshold: 10.0
sift_estimate_affine_shape: false
sift_max_num_orientations: 2
sift_upright: false            # 1 = force orientation to 0
sift_max_image_size: -1        # <=0 uses extractor default (no extra downscale)

# ------------------------------------------------------------------
# Matching (COLMAP SIFT brute-force; temporal overlap + spatial neighbors)
# GPU matcher uses CUDA SiftGPU, same device policy as extraction.
# Spatial uses VIO cam_from_world. Temporal hits are excluded from spatial.
# Pair verification failure does not fail the whole frame.
# OpenCV yaml cannot have ':' inside trailing comments.
# ------------------------------------------------------------------
match_use_gpu: true
match_gpu_index: "-1"          # -1 = auto (CUDA device 0), or 0 / 1 / ...
match_overlap: 10              # match current KF against the previous N KFs
match_spatial_max_distance: 10.0   # meters; VIO camera-center radius. <=0 disables spatial
match_spatial_max_angle_deg: 70.0  # degrees; optical-axis angle. <=0 disables spatial
match_spatial_max_num_images: 10   # keep nearest N spatial KFs. <=0 keeps all in range
match_num_threads: -1          # CPU 1-to-N workers. -1 = all cores. GPU matching stays serial
match_max_num_matches: 2048    # GPU SiftMatch uses n*n device memory. 32768 needs ~4GB
sift_match_max_ratio: 0.8      # Lowe ratio test
sift_match_max_distance: 0.7
sift_match_cross_check: true
match_cpu_brute_force: false    # CPU only. true = dense distance matrix, false = Faiss index
match_min_num_inliers: 15      # TwoViewGeometry RANSAC min inliers
match_max_error: 2.0           # TwoViewGeometry RANSAC max error in pixels
# Online TVG. E-only estimates the essential matrix (no F/H/watermark).
match_tvg_e_only: true
match_detect_watermark: false
match_use_degensac: false
match_ransac_min_num_trials: 30
match_ransac_max_num_trials: 500
match_ransac_confidence: 0.99

# ------------------------------------------------------------------
# Online mapper (P3P registration, triangulation, local BA)
# Defaults match OnlineMapperOptions. OpenCV yaml cannot have ':' in trailing comments.
# ------------------------------------------------------------------
mapper_min_num_inliers: 15                 # init partner min matches between the two KFs
mapper_abs_pose_min_num_inliers: 50        # P3P RANSAC min 2D-3D inliers
mapper_abs_pose_max_error: 1.0             # P3P RANSAC max error in pixels
mapper_abs_pose_min_inlier_ratio: 0.25
mapper_ba_local_num_images: 0              # 0 = no cap on first-level window
mapper_ba_min_covisibility_points: 15      # first-level = shared 3D >= this
mapper_ba_min_first_level_for_pose: 3      # fewer first-level KFs => freeze poses
mapper_ba_max_pose_center_jump: 0.5        # meters; revert LBA if center jumps more
mapper_ba_max_pose_angle_deg: 15.0         # degrees; revert LBA if rotation jumps more
mapper_filter_max_reproj_error: 2.0        # pixels; FilterPoints3DInImages
mapper_filter_min_tri_angle: 1.5           # degrees; FilterPoints3DInImages
mapper_tri_max_transitivity: 1
mapper_tri_create_max_angle_error: 2.0     # degrees; new triangulation
mapper_tri_continue_max_angle_error: 2.0   # degrees; continue existing tracks
mapper_tri_merge_max_reproj_error: 4.0     # pixels; MergeTracks
mapper_tri_complete_max_reproj_error: 4.0  # pixels; CompleteTracks / CompleteImage
mapper_tri_complete_max_transitivity: 5
mapper_tri_min_angle: 1.5                  # degrees; min pairwise triangulation angle
mapper_tri_ignore_two_view_tracks: false   # false = keep 2-view tracks


# ------------------------------------------------------------------
# Online loop closer P0 (MixVPR cosine retrieve + geometric verify, no map correction)
# Candidates: keyframes within loop_max_distance of the current camera
# center, excluding first-level covisible KFs, then heading / score / top-k.
# MixVPR requires an explicit TensorRT .engine path (no bundled fallback).
# ------------------------------------------------------------------
loop_enabled: true
loop_mixvpr_engine_path: "/home/aa/vslam_ws/src/vslam/data/models/mixvpr_resnet50_512_fp16.engine"
loop_mixvpr_use_gpu: true
loop_mixvpr_gpu_index: "-1"    # -1 = auto (CUDA device 0), or 0 / 1 / ...
loop_cooldown_num_images: 10
loop_max_distance: 10.0        # meters; <=0 disables the distance gate
loop_max_view_angle_deg: 60.0  # optical-axis angle; <=0 disables
loop_min_mixvpr_score: 0.0     # MixVPR cosine after L2; <=0 disables
loop_topk: 5                   # MixVPR cosine hits sent to geometric verify; <=0 keeps all
loop_min_covisibility_points: 15
loop_min_num_matches: 20                 # ORB: BoW matches >= 20 before Sim3
loop_min_num_verified_matches: 40        # ORB: nTotalMatches >= 40
loop_min_num_3d_correspondences: 20      # ORB: enough 3D matches to run Sim3
loop_min_num_3d_inliers: 20              # ORB: RANSAC/OptimizeSim3 min inliers
loop_correct_local: true
loop_max_correct_connected: 20
loop_fix_scale: false                 # false = estimate Sim3 scale; true = SE3 (s=1)
