%YAML:1.0 # need to specify the file type at the top!

# ==================================================================
# VSLAM application parameters 
# ==================================================================

# ------------------------------------------------------------------
# KeyframeSelect
# Images are fed by RosWrapper (left camera only).
# Pose is subscribed from OpenVINS pose topic.
# ------------------------------------------------------------------

# Selection thresholds
kf_dist_thresh: 1          # meters; select if translation from last KF exceeds this
kf_angle_thresh_deg: 20.0    # degrees; select if rotation from last KF exceeds this

# Image-pose timestamp sync
kf_sync_slop: 0.02           # seconds; max |t_image - t_pose| to pair

# Internal buffers
kf_pose_queue_size: 5000
kf_image_queue_size: 1000
kf_output_queue_size: 2000     # downstream KeyframeQueue capacity (drop oldest if full)

# Topics
kf_topic_pose: "/ov_msckf/poseimu"
kf_topic_keyframe_pose: "keyframe_pose"
kf_topic_keyframe_image: "keyframe_image"

# Publish selected keyframe pose/image for debugging / rosbag analysis
kf_publish_debug: true

# ------------------------------------------------------------------
# Map / MapManager
# Map: create COLMAP dirs + database.db (+ cameras)
# MapManager: consume keyframes and save images into the session
# Layout: <map_root_dir>/map/{database,images,masks,sparse}
# ------------------------------------------------------------------
map_root_dir: "/tmp/vslam_map"
map_clear_old_session: false
# Load the previous session (sparse + database) and relocalize into it
# instead of starting over. Takes precedence over clear_old_session.
map_resume_existing: true
map_save_images: true
map_image_extension: "png"

# ------------------------------------------------------------------
# SIFT
# ------------------------------------------------------------------
sift_use_gpu: true             # 1 = CUDA SiftGPU, 0 = VLFeat CPU SIFT
sift_gpu_index: "-1"           # -1 = auto (CUDA device 0), or 0 / 1 / ...
sift_max_num_features: 1000
sift_first_octave: -1          # -1 upsamples the image once
sift_num_octaves: 4
sift_octave_resolution: 3      # levels per octave
sift_peak_threshold: 0.0066666666667  # COLMAP default = 0.02 / octave_resolution
sift_edge_threshold: 10.0
sift_estimate_affine_shape: false
sift_max_num_orientations: 2
sift_upright: true            # 1 = force orientation to 0
sift_max_image_size: -1        # <=0 uses extractor default (no extra downscale)

# ------------------------------------------------------------------
# Matching
# ------------------------------------------------------------------
match_use_gpu: true
match_gpu_index: "-1"          # -1 = auto (CUDA device 0), or 0 / 1 / ...
match_overlap: 0              # match current KF against the previous N KFs
match_spatial_max_distance: 10.0   # meters; VIO camera-center radius. <=0 disables spatial
match_spatial_max_angle_deg: 70.0  # degrees; optical-axis angle. <=0 disables spatial
match_spatial_max_num_images: 15   # keep nearest N spatial KFs. <=0 keeps all in range
match_num_threads: -1          # CPU 1-to-N workers. -1 = all cores. GPU matching stays serial
match_max_num_matches: 2048    # GPU SiftMatch uses n*n device memory. 32768 needs ~4GB
sift_match_max_ratio: 0.8      # Lowe ratio test
sift_match_max_distance: 0.7
sift_match_cross_check: true
match_cpu_brute_force: false    # CPU only. true = dense distance matrix, false = Faiss index
match_min_num_inliers: 15      # TwoViewGeometry RANSAC min inliers
match_max_error: 2.0           # TwoViewGeometry RANSAC max error in pixels
# Online TVG. E-only estimates the essential matrix (no F/H/watermark).
match_tvg_e_only: true
match_detect_watermark: false
match_use_degensac: false
match_ransac_min_num_trials: 30
match_ransac_max_num_trials: 500
match_ransac_confidence: 0.99

# ------------------------------------------------------------------
# Online mapper (P3P registration, triangulation, local BA)
# ------------------------------------------------------------------
mapper_min_num_inliers: 15                 # init partner min matches between the two KFs
mapper_abs_pose_min_num_inliers: 25        # P3P RANSAC min 2D-3D inliers
mapper_abs_pose_max_error: 3.0             # P3P RANSAC max error in pixels
mapper_abs_pose_min_inlier_ratio: 0.25
mapper_ba_local_num_images: 30              # 0 = no cap on first-level window
mapper_ba_min_covisibility_points: 15      # first-level = shared 3D >= this
mapper_filter_max_reproj_error: 2.0        # pixels; FilterPoints3DInImages
mapper_filter_min_tri_angle: 1.5           # degrees; FilterPoints3DInImages
mapper_tri_max_transitivity: 3
mapper_tri_create_max_angle_error: 1.0     # degrees; new triangulation
mapper_tri_continue_max_angle_error: 2.0   # degrees; continue existing tracks
mapper_tri_merge_max_reproj_error: 4.0     # pixels; MergeTracks
mapper_tri_complete_max_reproj_error: 4.0  # pixels; CompleteTracks / CompleteImage
mapper_tri_complete_max_transitivity: 5
mapper_tri_min_angle: 2.0                  # degrees; min pairwise triangulation angle
mapper_tri_ignore_two_view_tracks: true   # false = keep 2-view tracks
# Local-map projection matching (points of the last N registered KFs, descriptor-checked)
mapper_local_map_num_images: 15            # <=0 disables
mapper_local_map_search_radius_px: 10.0    # pixels; around the VIO-predicted projection, before registration
mapper_local_map_refine_radius_px: 4.0     # pixels; around the refined projection, after registration
mapper_local_map_max_desc_distance: 0.7    # SIFT L2 on unit descriptors
mapper_local_map_max_ratio: 0.9            # best / second-best; >=1 disables
mapper_scale_check_max_ratio: 2.0          # keypoint scale vs scale predicted from the point size (s*range/f); <=1 disables
# Resumed maps: also project the points of previous-session KFs near the predicted pose
mapper_local_map_spatial_num_images: 8     # <=0 disables
mapper_local_map_spatial_max_distance_m: 2.0
mapper_local_map_spatial_max_angle_deg: 45.0
# Local BA VIO relative-pose priors between window KFs
mapper_ba_vio_prior_rot_sigma_deg: 1.0     # <=0 disables
mapper_ba_vio_prior_trans_sigma_m: 0.02
mapper_ba_vio_prior_trans_sigma_ratio: 0.03  # sigma grows with the VIO step length
mapper_ba_vio_prior_max_gap: 5             # only KFs at most this many ids apart
mapper_ba_fixed_min_points: 30          # LBA gauge = oldest window KF with >= this many 3D points; 0 = oldest
mapper_ba_loop_max_num_iterations: 50      # loop BA over the corrected chain (local BA uses 10)
# Local BA window padding when covisibility is weak (e.g. VIO-fallback frames)
mapper_ba_min_window_images: 4             # pad windows smaller than this; <=0 disables
mapper_ba_temporal_window_images: 5        # at most this many recent registered KFs added
mapper_sparse_write_every_n: 10            # <=1 writes sparse every keyframe; init/loop/exit always flush
# Redundant keyframe culling over the covisible window of each new keyframe
mapper_cull_enabled: true
mapper_cull_redundant_ratio: 0.9           # cull when this share of its 3D points is seen elsewhere
mapper_cull_min_other_observers: 3         # ... by at least this many other KFs
mapper_cull_max_scale_ratio: 1.2           # ... from no farther than this x its own viewing distance
mapper_cull_min_num_points: 30             # weaker frames carry the VIO chain, never culled
mapper_cull_protect_recent: 5              # newest N registered KFs are never culled
mapper_cull_max_neighbor_distance_m: 3.0   # VIO-chain neighbours left around a culled KF must stay this close
mapper_cull_max_neighbor_angle_deg: 45.0
mapper_cull_max_per_frame: 1
mapper_cull_prior_session: true           # also cull KFs loaded from a previous session
# Keyframe insertion check: a frame localized next to an existing keyframe whose
# points are already covered by the map is dropped (only updates point stats)
mapper_insert_check_enabled: true
mapper_insert_redundant_ratio: 0.75        # share of tracked points already seen by >= 3 other KFs
mapper_insert_ref_tracked_ratio: 0.9       # drop when tracked >= this x the reference KF's 3D points (ORB-SLAM)
mapper_insert_min_tracked: 40              # fewer tracked 3D points always inserts
mapper_insert_max_kf_distance_m: 1.0       # reference KF this close, sharing >= half the tracked points
mapper_insert_max_kf_angle_deg: 30.0
mapper_insert_max_consecutive_skips: 10    # then force a keyframe (and a loop query)
# Map freshness: per-point visible/found statistics, stale points are removed
mapper_point_stats_enabled: true
mapper_stale_min_visible: 15               # checks (keypoint near the projection) before a point can be judged
mapper_stale_max_found_ratio: 0.25         # remove points matched in fewer than this share of checks
mapper_stale_session_decay: 0.5            # scale of the previous sessions' counts on resume
mapper_stale_prior_session_only: true      # judge only points no KF of this session observes
# Spatial capacity: at most N KFs per voxel x viewing-yaw bin, lowest score evicted
mapper_capacity_enabled: true
mapper_capacity_voxel_m: 1.0
mapper_capacity_yaw_bins: 4
mapper_capacity_max_per_cell: 2
mapper_capacity_replace_ratio: 0.5         # replace an old KF only if it scores below this x the new one, else drop the new
mapper_capacity_min_session_frames: 20     # KFs mapped this session before previous-session KFs can be replaced
# Delete culled / dropped keyframes from database.db and images/ on exit
map_compact_database_on_exit: true

# ------------------------------------------------------------------
loop_enabled: true
loop_mixvpr_engine_path: "/home/cyf/vslam_ws/src/vslam/data/models/mixvpr_resnet50_512_fp16.engine"
loop_mixvpr_use_gpu: true
loop_mixvpr_gpu_index: "-1"    # -1 = auto (CUDA device 0), or 0 / 1 / ...
loop_cooldown_num_images: 5
loop_min_frame_gap: 50            # candidates must be >= this many keyframes older than the query
loop_max_distance: 30.0        # meters; <=0 disables the distance gate
loop_max_view_angle_deg: 360.0  # optical-axis angle; <=0 disables
loop_min_mixvpr_score: 0.40     # MixVPR cosine after L2; <=0 disables
loop_topk: 5                   # MixVPR cosine hits sent to geometric verify; <=0 keeps all
loop_min_covisibility_points: 15
loop_min_candidate_points: 30            # candidates with fewer 3D points are skipped; 0 disables
loop_min_num_matches: 20                 # feature matches with the candidate
loop_min_num_verified_matches: 30        # PnP inliers after guided matching
loop_min_num_3d_correspondences: 20      # 2D-3D pairs needed to run PnP
loop_min_num_3d_inliers: 20              # PnP RANSAC inliers
loop_correct_local: true
loop_max_correct_connected: 1000
loop_pnp_max_error: 3.0                  # px; loop PnP RANSAC / inlier threshold
loop_guided_radius_px: 7.5               # px; project loop map into current to grow matches
loop_scale_check_max_ratio: 2.0            # loop PnP inliers / guided / fusion matches need consistent keypoint scale; <=1 disables
loop_island_2d3d: true                   # too few 2D-3D from the candidate, match against its covisibility island
loop_island_epipolar_px: 4.0             # px; island matches must lie near the candidate-current epipolar plane
loop_max_rot_vs_essential_deg: 3.0       # PnP rotation vs essential-matrix rotation; <=0 disables
loop_max_correction_m: 15.0               # reject loops that move the current frame more than this
loop_max_correction_deg: 20.0
loop_pose_graph_min_covis: 50            # shared points for a covisibility edge in the pose graph
loop_pose_graph_4dof: true                # x,y,z+yaw per node; world must be the gravity-aligned VIO frame
loop_pose_graph_vio_odometry: true       # odometry edges from VIO relative poses instead of map poses
loop_pose_graph_odom_rot_sigma_deg: 1.0   # odometry / covisibility edge 1-sigma
loop_pose_graph_odom_trans_sigma_m: 0.02
loop_pose_graph_odom_trans_sigma_ratio: 0.03  # grows with step length
loop_pose_graph_loop_min_rot_sigma_deg: 0.2   # floor on the PnP-covariance loop edge sigma
loop_pose_graph_loop_min_trans_sigma_m: 0.02
loop_rover_enabled: true                 # trajectory-prior check, reject loops that deform the trajectory
loop_rover_min_threshold_m: 0.5          # m; RMSE of aligned centers before/after the pose graph
loop_rover_threshold_ratio: 0.01         # threshold grows with the path length between loop and current
loop_fuse_radius_px: 6.0                 # px; projection fusion after correction
loop_fuse_max_point_distance: 0.2        # meters; merge only if the two 3D points are this close
# ------------------------------------------------------------------
# Relocalization into a resumed map (map_resume_existing: true)
# Stricter than loop closure: a wrong fix biases every later frame.
# ------------------------------------------------------------------
loop_reloc_topk: 5                    # MixVPR global hits sent to PnP; <=0 keeps all
loop_reloc_min_mixvpr_score: 0.50     # global cosine gate before PnP
loop_reloc_min_num_matches: 30        # feature matches with the candidate
loop_reloc_min_num_3d_correspondences: 40  # 2D-3D pairs needed to run PnP
loop_reloc_min_inliers: 80            # PnP inliers to accept the relocalization
loop_reloc_max_rot_vs_essential_deg: 3.0   # PnP vs essential rotation; <=0 disables
